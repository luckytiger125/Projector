<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude 工作台 - 设置</title>
<style>
  /* 和网页端同一套“年鉴”设计变量（web/src/styles/tokens.css）；这个页面不经过打包，所以抄一份。字体只用系统自带的 */
  :root { color-scheme: light;
    --paper-0: #EBE2CB; --paper-1: #F2EAD6; --paper-2: #FAF5E6;
    --ink-1: #1C2733; --ink-2: #47525E; --ink-3: #7B7868; --ink-4: #A9A28E;
    --navy: #1B2A41; --navy-deep: #131F31; --navy-soft: rgba(27,42,65,.07); --on-navy: #F2EAD6;
    --vermilion: #C4452F; --hair: rgba(28,39,51,.13); --hair-strong: rgba(28,39,51,.30);
    --f-serif: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "STSong", "SimSun", serif;
    --f-sans: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif;
    --f-mono: "SF Mono", Consolas, "Cascadia Mono", "Courier New", monospace; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--paper-1); color: var(--ink-1); font: 14px/1.7 var(--f-sans);
         display: grid; grid-template-columns: 1.1fr 1fr; }
  /* 左半边：藏青底、竖排标题、朱砂印，和登录页一样 */
  .hero { position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; background: var(--navy); color: var(--on-navy); }
  .vert-title { writing-mode: vertical-rl; text-orientation: upright; font: 600 40px/1.15 var(--f-serif); letter-spacing: .38em; animation: fade .22s both; }
  .seal { position: absolute; bottom: 48px; border: 2px solid var(--vermilion); color: var(--vermilion); padding: 6px 12px; font: 700 12px var(--f-mono); letter-spacing: .2em; }
  .side { display: grid; place-items: center; padding: 24px; overflow-y: auto; min-height: 0; }
  .card { width: min(400px, 100%); animation: rise .22s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  @keyframes fade { from { opacity: 0; } }
  .kicker { font: 600 11px/1.4 var(--f-sans); letter-spacing: .16em; color: var(--ink-3); }
  h1 { font: 700 28px/1.3 var(--f-serif); margin: 8px 0 4px; }
  p.sub { margin: 0 0 20px; padding-bottom: 16px; border-bottom: 2px solid var(--ink-1); color: var(--ink-3); font-size: 13px; }
  label { display: block; font-weight: 600; font-size: 12px; color: var(--ink-2); margin: 16px 0 6px; }
  input[type=text] { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--hair-strong); border-radius: 2px; background: var(--paper-2); color: inherit; font: inherit; outline: none; transition: box-shadow .15s; }
  input[type=text]:focus-visible, button:focus-visible { box-shadow: 0 0 0 2px var(--paper-2), 0 0 0 4px var(--navy); outline: none; }
  input::placeholder { color: var(--ink-4); }
  .hint { color: var(--ink-3); font-size: 12px; margin-top: 6px; }
  .check { display: flex; gap: 8px; align-items: flex-start; margin-top: 20px; cursor: pointer; color: var(--ink-1); font-size: 13px; }
  .check input { margin-top: 5px; accent-color: var(--navy); }
  #serverBox { display: none; border-left: 2px solid var(--hair-strong); padding-left: 12px; }
  button { font: inherit; cursor: pointer; }
  #save { margin-top: 24px; width: 100%; height: 40px; border: 0; border-radius: 2px; background: var(--navy); color: var(--on-navy); font-weight: 600; transition: background .15s; }
  #save:hover { background: var(--navy-deep); }
  #save:disabled { opacity: .55; cursor: default; }
  #status { min-height: 1.7em; margin-top: 12px; font-size: 13px; color: var(--ink-2); }
  #status.err { color: var(--vermilion); }
  .found { display: flex; flex-direction: column; gap: 6px; }
  .found button { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; min-height: 40px; padding: 8px 12px; text-align: left; background: var(--paper-2); color: inherit; border: 1px solid var(--hair); border-radius: 2px; font-weight: 600; animation: rise .22s both; }
  .found button:hover { border-color: var(--hair-strong); }
  .found button.on { border-color: var(--navy); background: var(--navy-soft); box-shadow: inset 3px 0 0 var(--navy); }
  .found .u { color: var(--ink-3); font: 400 12px var(--f-mono); }
  .row { display: flex; align-items: baseline; gap: 8px; margin: 0 0 6px; }
  .row label { margin: 0; flex: 1; }
  .link { background: none; border: 0; color: var(--navy); padding: 0; font-size: 12px; text-decoration: underline; text-underline-offset: 3px; }
  @media (max-width: 780px) { body { grid-template-columns: 1fr; } .hero { display: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<section class="hero" aria-hidden="true">
  <div class="vert-title">综合部工作台</div>
  <div class="seal">连接</div>
</section>
<section class="side">
<div class="card">
  <div class="kicker">Projector · 综合部工作台</div>
  <h1>连接台式机</h1>
  <p class="sub">选择局域网里的台式机，之后打开软件会直接进入登录页。以后可以在托盘图标的菜单里修改。</p>

  <div class="row"><label>局域网里的服务器</label><button class="link" id="scan">重新查找</button></div>
  <div class="found" id="found"><div class="hint">正在查找…</div></div>

  <label for="url">服务器地址</label>
  <input id="url" type="text" value="http://localhost:8080" spellcheck="false">
  <div class="hint">上面找到了就点一下，会自动填好。找不到时手动填：http://台式机名:8080（Mac 上写成 台式机名.local），或者 http://台式机IP:8080</div>

  <label class="check"><input id="mode" type="checkbox"><span>服务端模式（只在台式机上勾选）<br>
    <span class="hint" style="font-weight:400">开机自动在后台启动中心服务，崩溃后自动重启</span></span></label>
  <div id="serverBox">
    <label for="dir">项目文件夹</label>
    <input id="dir" type="text" placeholder="例如 D:\Projector" spellcheck="false">
    <div class="hint">server.py 和 config.bat 所在的文件夹</div>
  </div>

  <button id="save">保存并连接</button>
  <div id="status" role="status"></div>
</div>
</section>
<script>
const $ = id => document.getElementById(id);
const invoke = window.__TAURI__ && window.__TAURI__.core.invoke;

let cfgUrl = "";
function setStatus(text, err) { $("status").textContent = text; $("status").className = err ? "err" : ""; }
$("mode").onchange = () => { $("serverBox").style.display = $("mode").checked ? "block" : "none"; };

async function load() {
  if (!invoke) return setStatus("这个页面需要在 Claude 工作台桌面软件里打开", true);
  const cfg = await invoke("get_config");
  cfgUrl = cfg.server_url;
  if (cfg.server_url) $("url").value = cfg.server_url;
  scan();
  $("mode").checked = cfg.server_mode;
  $("dir").value = cfg.project_dir;
  $("mode").onchange();
}

$("save").onclick = async () => {
  $("save").disabled = true;
  setStatus("正在连接…");
  try {
    await invoke("save_config", { serverUrl: $("url").value.trim(), serverMode: $("mode").checked, projectDir: $("dir").value.trim() });
    setStatus($("mode").checked ? "已保存，正在启动中心服务…" : "已保存，正在打开…");
  } catch (e) {
    setStatus(String(e), true);
    $("save").disabled = false;
  }
};
async function scan() {
  $("found").innerHTML = '<div class="hint">正在查找…</div>';
  try {
    const list = await invoke("discover_servers");
    if (!list.length) {
      $("found").innerHTML = '<div class="hint">没找到。确认台式机上的服务已经启动、两台电脑连的是同一个网络；或者在下面手动填地址。</div>';
      return;
    }
    $("found").innerHTML = "";
    for (const s of list) {
      const b = document.createElement("button");
      const n = document.createElement("span"), u = document.createElement("span");
      n.textContent = s.name; u.className = "u"; u.textContent = s.url;   // 名字来自局域网广播，不当 HTML 拼
      b.append(n, u);
      b.onclick = () => {
        $("url").value = s.url;
        $("found").querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
      };
      $("found").appendChild(b);
    }
    if (list.length === 1 && !cfgUrl) $("found").querySelector("button").click();
  } catch (e) { $("found").innerHTML = `<div class="hint">查找失败：${e}</div>`; }
}
$("scan").onclick = scan;
$("url").onkeydown = $("dir").onkeydown = e => { if (e.key === "Enter") $("save").click(); };
load();
</script>
</body>
</html>
