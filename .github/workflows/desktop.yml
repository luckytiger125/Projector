name: 桌面软件（Windows 安装包）

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24   # 和前端（server-tests.yml）用同一个版本
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - run: npm ci

      - run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: Projector-Windows-installer
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # 打 v 开头的标签时：先把服务端和前端的测试跑一遍，不过就不发 Release
  tests:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/server-tests.yml

  # 发 Release：桌面安装包 + 台式机服务端压缩包
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Projector-Windows-installer
          path: installers

      - name: 打包服务端
        shell: bash
        run: |
          # 前端产物是提交在 static/app 里的（台式机不装 Node）。打包前确认首页引用的文件都在，缺了就不发版
          test -f static/app/index.html
          for f in $(grep -o '/static/app/assets/[^"]*' static/app/index.html); do test -f ".$f" || { echo "缺少前端产物：$f"; exit 1; }; done
          git archive --format=zip --prefix=Projector-server/ -o "Projector-server-${GITHUB_REF_NAME}.zip" HEAD \
            ':(glob)*.py' requirements.txt requirements-sdk.txt static \
            install.bat start.bat config.example.bat README.md

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          name: Projector ${{ github.ref_name }}
          body: |
            **台式机（跑 Claude 的那台）**：下载 `Projector-server-${{ github.ref_name }}.zip`，解压后双击 `install.bat`，按提示填写，再双击 `start.bat`。
            **同事的电脑 / 想用桌面软件**：下载 `Projector_*_x64-setup.exe` 安装，第一次打开填 `http://台式机IP:8080`。
            安装包没有签名，Windows 提示“已保护你的电脑”时点“更多信息”→“仍要运行”。详细说明见 README。
          files: |
            Projector-server-${{ github.ref_name }}.zip
            installers/**/*.msi
            installers/**/*.exe
