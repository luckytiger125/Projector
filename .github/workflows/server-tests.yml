name: 服务端测试

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "tests/**"
      - "requirements*.txt"
      - "web/**"
      - "static/**"
      - ".github/workflows/server-tests.yml"
  pull_request:
    paths:
      - "**/*.py"
      - "tests/**"
      - "requirements*.txt"
      - "web/**"
      - "static/**"
      - ".github/workflows/server-tests.yml"
  workflow_dispatch:
  workflow_call:   # 发版流程（desktop.yml）打标签时会先调用这里，测试不过就不发 Release

permissions:
  contents: read

# 同一分支/PR 上有新提交时，取消还在跑的旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Windows 默认编码不是 UTF-8，不设的话中文读写会出错
  PYTHONUTF8: "1"

jobs:
  pytest:
    name: pytest（${{ matrix.os }} / Python ${{ matrix.python }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # windows 是实际部署环境，最重要
        os: [windows-latest, ubuntu-latest]
        # README 写的最低版本 3.10，以及当前版本 3.13
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: python -m pip install -r requirements.txt -r requirements-dev.txt

      # 测试通过 tests/conftest.py 里的环境变量自我隔离，不需要密钥或外部服务
      - run: python -m pytest -q

  frontend:
    name: 前端类型检查和构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run check

      - run: npm run build

      # 提交进仓库的构建产物必须和源码一致
      - name: 检查 static/app 和源码一致
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain -- static/app)" ]; then
            git status --short -- static/app
            git diff --stat -- static/app
            echo "::error::static/app 和 web/ 源码对不上：改了 web/ 之后要重新 npm run build 并提交 static/app"
            exit 1
          fi
